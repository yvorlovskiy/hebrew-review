<title>Hebrew Review</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--alt:#e9edf3;--ink:#16202c;--soft:#5d6b7a;--line:#d6dde6;--accent:#2457a6;--accent-ink:#fff;--again:#c04a3d;--got:#1f7a55;--r:16px;color-scheme:light dark;-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#18212c;--alt:#212d3b;--ink:#e8eef5;--soft:#97a6b6;--line:#2b3949;--accent:#6c9ae6;--accent-ink:#0b1626;--again:#e0705f;--got:#4cba8b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none}
.screen{max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:.8rem;font-weight:600;margin:0}
h1{margin:4px 0 6px;font-size:2rem;line-height:1.15}.sub{color:var(--soft);margin:0 0 20px;font-size:.95rem}
.list{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:56px;text-align:left;width:100%}
.sec:active{background:var(--alt)}.sec b{font-size:1.05rem}.sec span{color:var(--soft);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec--all{border-color:var(--accent)}
.toggle{display:flex;gap:6px;background:var(--alt);border-radius:999px;padding:4px;margin:0 0 16px}
.toggle button{flex:1;border-radius:999px;padding:9px 8px;font-size:.88rem;color:var(--soft)}.toggle button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0002}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--soft);font-size:.9rem}
.bar button{color:var(--accent);padding:8px 0;font-weight:600}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;min-height:320px;text-align:center}
.q{font-size:1.45rem;font-weight:600}.tr{font-size:1.7rem;font-weight:700;color:var(--accent)}.he{font-size:1.5rem;direction:rtl;color:var(--ink)}.n{color:var(--soft);font-size:.95rem}
.hint{color:var(--soft);font-size:.9rem}
.play{align-self:center;display:inline-flex;align-items:center;gap:8px;background:var(--alt);border-radius:999px;padding:10px 18px;font-weight:600}
.foot{display:flex;gap:10px;margin-top:14px}.foot button{flex:1;min-height:56px;border-radius:var(--r);font-weight:700;font-size:1.05rem}
.primary{background:var(--accent);color:var(--accent-ink)}.again{background:var(--again);color:#fff}.got{background:var(--got);color:#fff}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1}
</style>
</head>

ve a bag?", "he": "אפשר שקית?", "tr": "efshar sakit?", "n": "Bags cost a few agorot."}, {"id": "b1f181462f", "s": "Grocery", "en": "Do you need a bag? (cashier asks)", "he": "צריך שקית?", "tr": "tsarikh sakit?", "n": ""}, {"id": "f7360aac4f", "s": "Grocery", "en": "No bag, thanks", "he": "בלי שקית, תודה", "tr": "bli sakit, toda", "n": ""}, {"id": "982f3478de", "s": "Grocery", "en": "Are you a club member? (cashier asks)", "he": "יש לך מועדון?", "tr": "yesh lekha mo'adon?", "n": "Loyalty card. Answer: lo."}, {"id": "4ed29347f6", "s": "Grocery", "en": "Where can I find...?", "he": "איפה יש...?", "tr": "eifo yesh...?", "n": ""}, {"id": "d02440bbb1", "s": "Grocery", "en": "Bread / milk / eggs", "he": "לחם / חלב / ביצים", "tr": "lekhem / khalav / beitsim", "n": ""}, {"id": "1b3e50fe55", "s": "Grocery", "en": "Water bottle", "he": "בקבוק מים", "tr": "bakbuk mayim", "n": ""}, {"id": "7c8244c8f3", "s": "Grocery", "en": "Open / closed", "he": "פתוח / סגור", "tr": "patuakh / sagur", "n": ""}, {"id": "b86fe9217b", "s": "Around", "en": "Right / left / straight", "he": "ימינה / שמאלה / ישר", "tr": "yamina / smola / yashar", "n": ""}, {"id": "c0cfbf4770", "s": "Around", "en": "Here / there", "he": "פה / שם", "tr": "po / sham", "n": ""}, {"id": "d6d6f90582", "s": "Around", "en": "Stop here, please", "he": "פה, בבקשה", "tr": "po, bevakasha", "n": ""}, {"id": "981224be86", "s": "Around", "en": "Bus / train / taxi", "he": "אוטובוס / רכבת / מונית", "tr": "otobus / rakevet / monit", "n": ""}, {"id": "b1ba188d69", "s": "Around", "en": "Station / stop", "he": "תחנה", "tr": "takhana", "n": ""}, {"id": "5ea529f965", "s": "Around", "en": "With the meter, please (taxi)", "he": "עם מונה, בבקשה", "tr": "im mone, bevakasha", "n": ""}, {"id": "4ba87638b3", "s": "Around", "en": "Address", "he": "כתובת", "tr": "ktovet", "n": ""}, {"id": "c30d003dc4", "s": "Around", "en": "How long does it take?", "he": "כמה זמן?", "tr": "kama zman?", "n": ""}, {"id": "4c9fc86277", "s": "Around", "en": "Is it far?", "he": "זה רחוק?", "tr": "ze rakhok?", "n": ""}, {"id": "6180b9dd6d", "s": "Around", "en": "Now / later / today / tomorrow", "he": "עכשיו / אחר כך / היום / מחר", "tr": "akhshav / akhar kakh / hayom / makhar", "n": ""}, {"id": "b527e6f854", "s": "Numbers", "en": "20 / 30 / 40 / 50", "he": "עשרים / שלושים / ארבעים / חמישים", "tr": "esrim / shloshim / arba'im / khamishim", "n": ""}, {"id": "337e6cdc04", "s": "Numbers", "en": "60 / 70 / 80 / 90", "he": "שישים / שבעים / שמונים / תשעים", "tr": "shishim / shiv'im / shmonim / tish'im", "n": ""}, {"id": "20799a3a5e", "s": "Numbers", "en": "100 / 200 / 1,000", "he": "מאה / מאתיים / אלף", "tr": "me'a / matayim / elef", "n": ""}, {"id": "42041aaadb", "s": "Numbers", "en": "Half", "he": "חצי", "tr": "khetsi", "n": ""}, {"id": "c1ef01029f", "s": "Numbers", "en": "25 shekels", "he": "עשרים וחמש שקל", "tr": "esrim ve-khamesh shekel", "n": "Tens, then ve- plus the unit."}], NAMES = {"Basics": "Basics", "Help": "When you're stuck", "Asking": "Asking for things", "Cafe": "Cafe and restaurant", "Paying": "Paying", "Grocery": "Grocery store", "Around": "Getting around", "Numbers": "Numbers past 10"};

  const kn = cs => cs.filter(known).length;
  const resume = sess && sess.queue.length
    ? `<button class="sec sec--all" id="resume"><b>Resume: ${esc(sess.title)}</b><span>${sess.got}/${sess.total}</span></button>` : "";
  root.innerHTML = `<main class="screen"><p class="eyebrow">Get-around Hebrew</p><h1>Hebrew Review</h1>
  <p class="sub">${kn(CARDS)} of ${CARDS.length} known. <b>kh</b> is the throaty sound, as in Bach. Men's forms by default.</p>
  <div class="toggle"><button data-m="en" class="${mode === "en" ? "on" : ""}">English → Hebrew</button><button data-m="he" class="${mode === "he" ? "on" : ""}">Listen → English</button></div>
  <div class="list">${resume}<button class="sec" data-s=""><b>Everything, weakest first</b><span>${kn(CARDS)}/${CARDS.length}</span></button>
  ${secs.map(s => { const cs = CARDS.filter(c => c.s === s); return `<button class="sec" data-s="${s}"><b>${NAMES[s] || s}</b><span>${kn(cs)}/${cs.length}</span></button>`; }).join("")}</div>
  <p class="sub" style="margin-top:20px;text-align:center"><button id="reset" style="color:var(--soft);text-decoration:underline;font-size:.85rem">Reset progress</button></p></main>`;
  root.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; set("hr.mode", mode); home(); });
  root.querySelectorAll("[data-s]").forEach(b => b.onclick = () => study(newSession(b.dataset.s)));
  const r = root.querySelector("#resume"); if (r) r.onclick = () => study(sess);
  root.querySelector("#reset").onclick = () => { if (confirm("Clear all progress?")) { prog = {}; saveProg(); set("hr.session", null); home(); } };
}

// Unknown cards first (fewest gets, most misses), shuffled within each tier.
function newSession(sec) {
  const cs = shuffle(CARDS.filter(c => !sec || c.s === sec));
  const score = c => { const p = prog[c.id] || {}; return (p.g || 0) - (p.a || 0); };
  cs.sort((x, y) => score(x) - score(y));
  return { sec, title: sec ? (NAMES[sec] || sec) : "Everything", queue: cs.map(c => c.id), got: 0, total: cs.length };
}

function study(S) {
  S.queue = S.queue.filter(id => BY[id]);   // drop cards removed since the session was saved
  let shown = false;
  const save = () => set("hr.session", S.queue.length ? S : null);
  save();
  function render() {
    if (!S.queue.length) {
      set("hr.session", null);
      root.innerHTML = `<main class="screen"><div class="done"><h1>Done</h1><p class="sub">All ${S.total} cards in ${esc(S.title)}.</p>
      <div class="foot"><button class="primary" id="again">Go again</button><button class="sec" id="home" style="justify-content:center">Sections</button></div></div></main>`;
      root.querySelector("#again").onclick = () => study(newSession(S.sec)); root.querySelector("#home").onclick = home; return;
    }
    const c = BY[S.queue[0]];
    const answer = `<div class="tr">${esc(c.tr)}</div><div class="he" lang="he">${esc(c.he)}</div>${c.n ? `<div class="n">${esc(c.n)}</div>` : ""}`;
    const playBtn = `<button class="play" id="p">▶ Play</button>`;
    const body = shown
      ? `<div class="q">${esc(c.en)}</div>` + answer + playBtn
      : (mode === "en" ? `<div class="q">${esc(c.en)}</div>` : playBtn) + `<div class="hint">Tap to reveal</div>`;
    root.innerHTML = `<main class="screen"><div class="bar"><button id="home">‹ Sections</button><span>${esc(S.title)} · ${S.got}/${S.total}</span></div>
    <div class="card" id="card">${body}</div>
    <div class="foot">${shown ? `<button class="again" id="a">Again</button><button class="got" id="g">Got it</button>` : `<button class="primary" id="r">Show answer</button>`}</div></main>`;
    root.querySelector("#home").onclick = home;
    const p = root.querySelector("#p"); if (p) p.onclick = e => { e.stopPropagation(); play(c); };
    if (!shown) {
      if (mode === "he") play(c);
      const reveal = () => { shown = true; render(); if (mode === "en") play(c); };
      root.querySelector("#r").onclick = reveal; root.querySelector("#card").onclick = reveal;
    } else {
      const mark = k => { const q = prog[c.id] || (prog[c.id] = {}); q[k] = (q[k] || 0) + 1; q.t = Date.now(); saveProg(); };
      root.querySelector("#a").onclick = () => { mark("a"); const id = S.queue.shift(); S.queue.splice(Math.min(S.queue.length, 3), 0, id); shown = false; save(); render(); };
      root.querySelector("#g").onclick = () => { mark("g"); S.queue.shift(); S.got++; shown = false; save(); render(); };
    }
  }
  render();
}
home();
</script>
</body>
</html>
